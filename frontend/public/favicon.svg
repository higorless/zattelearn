<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0a0a0a"/>
  <!-- Top bar -->
  <rect x="6" y="6" width="20" height="4" fill="#f0f0f0"/>
  <!-- Diagonal: top-right corner → bottom-left corner -->
  <polygon points="26,10 22,10 6,22 10,22" fill="#f0f0f0"/>
  <!-- Bottom bar -->
  <rect x="6" y="22" width="20" height="4" fill="#f0f0f0"/>
  <!-- Blue accent dot — top-right -->
  <rect x="22" y="6" width="4" height="4" fill="#4d7cff"/>
</svg>
