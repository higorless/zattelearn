services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zettelearn-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - zettelearn

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: zettelearn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - zettelearn

networks:
  zettelearn:
    driver: bridge
